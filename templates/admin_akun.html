<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Akun - Fluenglo</title>
    <!-- Belum ada styling, menyusul dari Aya setelah desain admin jadi -->
</head>
<body>

    <p>Admin: {{ nama_admin }} | <a href="{{ url_for('logout') }}">Keluar</a></p>

    <h1>Kelola Akun</h1>

    <h2>Daftar Akun</h2>
    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Username</th>
            <th>Role</th>
            <th>Aksi</th>
        </tr>
        {% for u in daftar_akun %}
        <tr>
            <td>{{ u["id"] }}</td>
            <td>{{ u["nama"] }}</td>
            <td>{{ u["username"] }}</td>
            <td>{{ u["role"] }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin_akun_hapus', user_id=u['id']) }}" style="display:inline">
                    <button type="submit">Hapus</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <h2>Tambah Akun</h2>
    <form method="POST" action="{{ url_for('admin_akun_tambah') }}">
        <label>Nama: <input type="text" name="nama" required></label><br>
        <label>Username: <input type="text" name="username" required></label><br>
        <label>Password: <input type="password" name="password" required></label><br>
        <label>Role:
            <select name="role">
                <option value="siswa">Siswa</option>
                <option value="pengajar">Pengajar</option>
                <option value="admin">Admin</option>
            </select>
        </label><br>
        <button type="submit">Tambah Akun</button>
    </form>

</body>
</html>
