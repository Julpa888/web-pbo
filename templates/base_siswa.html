<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ judul_halaman }} - Fluenglo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='siswa.css') }}">
</head>
<body>

    <div class="layout">

        <aside class="sidebar">
            <div class="logo">Fluenglo</div>
            <nav>
                <a href="{{ url_for('siswa_jadwal') }}" class="{{ 'active' if halaman_aktif == 'jadwal' else '' }}">Jadwal</a>
                <a href="{{ url_for('siswa_tugas') }}" class="{{ 'active' if halaman_aktif == 'tugas' else '' }}">Tugas</a>
                <a href="{{ url_for('siswa_materi') }}" class="{{ 'active' if halaman_aktif == 'materi' else '' }}">Materi</a>
                <a href="{{ url_for('siswa_monitoring') }}" class="{{ 'active' if halaman_aktif == 'monitoring' else '' }}">Monitoring Anak</a>
            </nav>
        </aside>

        <div class="main">

            <header class="topbar">
                <span class="breadcrumb">Login &gt; Siswa &gt; {{ judul_halaman }}</span>
                <div class="topbar-right">
                    <span class="user-name">Siswa: {{ nama_siswa }}</span>
                    <a href="{{ url_for('login') }}" class="btn-keluar">Keluar</a>
                </div>
            </header>

            <div class="content">
                <h1 class="content-title">{{ judul_halaman }}</h1>
                <div class="content-body">
                    {% block isi %}{% endblock %}
                </div>
            </div>

        </div>

    </div>

</body>
</html>
