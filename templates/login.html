<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fluenglo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-card">

        <div class="mondrian">
            <div class="block red-a"></div>
            <div class="block title">Fluenglo</div>
            <div class="block yellow-a"></div>
            <div class="block blue-a"></div>
            <div class="block black-a"></div>
            <div class="block white-a"></div>
            <div class="block white-b"></div>
            <div class="block yellow-b"></div>
            <div class="block red-b"></div>
        </div>

        <div class="form-panel">
            <h1>Masuk ke Fluenglo</h1>

            <form method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password" required>

                <button type="submit">Login</button>
            </form>

            <p class="note">
                Setelah login, menu dan fitur menyesuaikan peran: Siswa, Pengajar, atau Admin.
            </p>
        </div>

    </div>

</body>
</html>
